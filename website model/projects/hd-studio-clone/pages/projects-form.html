<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Form — HD Studio Clone</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">HD<span>Studio</span></div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Platform</div>
      <a href="../index.html" class="nav-link">🏠 Dashboard</a>
      <a href="projects-list.html" class="nav-link active">📁 Projects</a>
      <div class="nav-section-label">Content</div>
      <a href="showcase-list.html" class="nav-link">🎨 Showcase</a>
      <a href="pricing-list.html" class="nav-link">💰 Pricing</a>
      <div class="nav-section-label">Admin</div>
      <a href="users-list.html" class="nav-link">👥 Users</a>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" id="logoutBtn">Sign out</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="page-title" id="pageTitle">New Project</span>
    </header>
    <div class="content">
      <div id="errorMsg"></div>
      <div class="card" style="max-width:600px">
        <div class="card-body">
          <form id="projectForm">
            <div class="form-group">
              <label class="form-label">Name *</label>
              <input type="text" class="form-control" id="name" required placeholder="My App">
            </div>
            <div class="form-group">
              <label class="form-label">Description</label>
              <textarea class="form-control" id="description" placeholder="What does this app do?"></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">Status</label>
              <select class="form-control" id="status">
                <option value="draft">Draft</option>
                <option value="live">Live</option>
                <option value="archived">Archived</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">App URL</label>
              <input type="text" class="form-control" id="app_url" placeholder="https://myapp.vercel.app">
            </div>
            <div class="form-group">
              <label class="form-label">Deploy Target</label>
              <select class="form-control" id="deploy_target">
                <option value="">Not set</option>
                <option value="vercel">Vercel</option>
                <option value="azure">Azure Static Web Apps</option>
                <option value="railway">Railway</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Credits Used</label>
              <input type="number" class="form-control" id="credits_used" min="0" value="0">
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary" id="submitBtn">Save Project</button>
              <a href="projects-list.html" class="btn btn-ghost">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import supabase from '../js/supabase-client.js';
    import { currentUser } from '../js/auth-guard.js';

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (id) document.getElementById('pageTitle').textContent = 'Edit Project';

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    });

    if (id) {
      const { data, error } = await supabase.from('projects').select('*').eq('id', id).single();
      if (error) { showError(error.message); }
      else {
        document.getElementById('name').value = data.name ?? '';
        document.getElementById('description').value = data.description ?? '';
        document.getElementById('status').value = data.status ?? 'draft';
        document.getElementById('app_url').value = data.app_url ?? '';
        document.getElementById('deploy_target').value = data.deploy_target ?? '';
        document.getElementById('credits_used').value = data.credits_used ?? 0;
      }
    }

    document.getElementById('projectForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Saving…';

      const payload = {
        name: document.getElementById('name').value.trim(),
        description: document.getElementById('description').value.trim(),
        status: document.getElementById('status').value,
        app_url: document.getElementById('app_url').value.trim(),
        deploy_target: document.getElementById('deploy_target').value,
        credits_used: parseInt(document.getElementById('credits_used').value) || 0,
        updated_at: new Date().toISOString(),
      };
      if (id) { payload.id = id; }
      else { payload.owner_id = currentUser?.id; }

      const { error } = await supabase.from('projects').upsert(payload);
      if (error) { showError(error.message); btn.disabled = false; btn.textContent = 'Save Project'; }
      else { window.location.href = 'projects-list.html'; }
    });

    function showError(msg) {
      document.getElementById('errorMsg').innerHTML = `<div class="alert alert-danger">${msg}</div>`;
    }
  </script>
</body>
</html>
