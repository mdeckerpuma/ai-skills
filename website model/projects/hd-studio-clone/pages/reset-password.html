<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — HD Studio Clone</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--sidebar-bg); }
    .auth-box { background: var(--surface); border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
    .auth-logo { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
    .auth-logo span { color: var(--brand); }
    .auth-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 28px; }
    #successMsg { display: none; text-align: center; padding: 20px 0; }
    .success-icon { font-size: 40px; margin-bottom: 12px; }
    .success-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .success-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="auth-box">
    <div class="auth-logo">HD<span>Studio</span></div>
    <div class="auth-subtitle" id="pageSubtitle">Reset your password</div>

    <div id="errorMsg"></div>

    <!-- State 1: Request reset (no token) -->
    <div id="requestForm">
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:20px;line-height:1.6">
        Enter your email address and we'll send you a link to reset your password.
      </p>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="resetEmail" placeholder="you@example.com">
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" id="requestBtn" onclick="sendReset()">
        Send Reset Link
      </button>
      <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-muted)">
        Remember it? <a href="login.html" style="color:var(--brand)">Sign in</a>
      </p>
    </div>

    <!-- State 2: Set new password (token present) -->
    <div id="resetForm" style="display:none">
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input type="password" class="form-control" id="newPassword" placeholder="Min 8 characters" minlength="8">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control" id="confirmPassword" placeholder="Repeat new password">
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" id="resetBtn" onclick="setNewPassword()">
        Set New Password
      </button>
    </div>

    <!-- Success state -->
    <div id="successMsg">
      <div class="success-icon">✉️</div>
      <div class="success-title" id="successTitle">Check your email</div>
      <div class="success-sub" id="successSub">We sent a password reset link to your email address.</div>
      <a href="login.html" class="btn btn-primary" style="display:flex;justify-content:center">Back to Sign In</a>
    </div>
  </div>

  <script type="module">
    import supabase from '../js/supabase-client.js';

    // Detect recovery mode (Supabase redirects with #access_token when reset link is clicked)
    const hash = window.location.hash;
    const isRecovery = hash.includes('type=recovery') || hash.includes('access_token');

    if (isRecovery) {
      document.getElementById('pageSubtitle').textContent = 'Set a new password';
      document.getElementById('requestForm').style.display = 'none';
      document.getElementById('resetForm').style.display = '';
    }

    window.sendReset = async () => {
      const btn = document.getElementById('requestBtn');
      btn.disabled = true; btn.textContent = 'Sending…';
      const email = document.getElementById('resetEmail').value.trim();
      if (!email) {
        showError('Please enter your email address.');
        btn.disabled = false; btn.textContent = 'Send Reset Link';
        return;
      }
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/pages/reset-password.html'
      });
      if (error) {
        showError(error.message);
        btn.disabled = false; btn.textContent = 'Send Reset Link';
      } else {
        document.getElementById('requestForm').style.display = 'none';
        document.getElementById('successMsg').style.display = '';
      }
    };

    window.setNewPassword = async () => {
      const btn = document.getElementById('resetBtn');
      const pw  = document.getElementById('newPassword').value;
      const cpw = document.getElementById('confirmPassword').value;
      if (pw.length < 8) { showError('Password must be at least 8 characters.'); return; }
      if (pw !== cpw)    { showError('Passwords do not match.'); return; }
      btn.disabled = true; btn.textContent = 'Updating…';
      const { error } = await supabase.auth.updateUser({ password: pw });
      if (error) {
        showError(error.message);
        btn.disabled = false; btn.textContent = 'Set New Password';
      } else {
        document.getElementById('resetForm').style.display = 'none';
        document.getElementById('successTitle').textContent = 'Password updated!';
        document.getElementById('successSub').textContent = 'Your password has been changed. Sign in with your new password.';
        document.getElementById('successMsg').querySelector('.success-icon').textContent = '✅';
        document.getElementById('successMsg').style.display = '';
      }
    };

    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (!isRecovery) sendReset();
      else setNewPassword();
    });

    function showError(msg) {
      document.getElementById('errorMsg').innerHTML = `<div class="alert alert-danger">${msg}</div>`;
    }
  </script>
</body>
</html>
