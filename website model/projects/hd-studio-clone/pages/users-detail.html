<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Detail — HD Studio Clone</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">HD<span>Studio</span></div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Platform</div>
      <a href="../index.html" class="nav-link">🏠 Dashboard</a>
      <a href="projects-list.html" class="nav-link">📁 Projects</a>
      <div class="nav-section-label">Content</div>
      <a href="showcase-list.html" class="nav-link">🎨 Showcase</a>
      <a href="pricing-list.html" class="nav-link">💰 Pricing</a>
      <div class="nav-section-label">Admin</div>
      <a href="users-list.html" class="nav-link active">👥 Users</a>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" id="logoutBtn">Sign out</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="page-title">User Detail</span>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>
    <div class="content">
      <div id="errorMsg"></div>
      <div class="card" style="max-width:600px" id="detailCard">
        <div class="loader"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <script type="module">
    import supabase from '../js/supabase-client.js';
    import '../js/admin-guard.js';

    const id = new URLSearchParams(window.location.search).get('id');
    if (!id) { window.location.href = 'users-list.html'; }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    });

    const { data, error } = await supabase.from('users').select('*').eq('id', id).single();
    if (error) {
      document.getElementById('errorMsg').innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
      document.getElementById('detailCard').innerHTML = '';
    } else {
      document.getElementById('topbarActions').innerHTML = `
        <a href="users-form.html?id=${id}" class="btn btn-secondary btn-sm">Edit</a>
        <a href="users-delete.html?id=${id}" class="btn btn-danger btn-sm">Delete</a>
        <a href="users-list.html" class="btn btn-ghost btn-sm">← Back</a>`;
      document.getElementById('detailCard').innerHTML = `
        <div class="card-header"><h2>${esc(data.email)}</h2></div>
        <div class="card-body">
          <dl class="detail-list">
            <dt>Email</dt><dd>${esc(data.email)}</dd>
            <dt>Name</dt><dd>${esc(data.name) || '—'}</dd>
            <dt>Role</dt><dd><span class="badge ${data.role==='admin'?'badge-green':'badge-gray'}">${esc(data.role)}</span></dd>
            <dt>Created</dt><dd>${fmtDate(data.created_at)}</dd>
            <dt>ID</dt><dd style="font-size:12px;color:var(--text-muted)">${esc(data.id)}</dd>
          </dl>
        </div>`;
    }

    function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function fmtDate(d) { return d ? new Date(d).toLocaleString() : '—'; }
  </script>
</body>
</html>
