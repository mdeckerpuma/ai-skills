<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Detail — HD Studio Clone</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">HD<span>Studio</span></div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Platform</div>
      <a href="../index.html" class="nav-link">🏠 Dashboard</a>
      <a href="projects-list.html" class="nav-link active">📁 Projects</a>
      <div class="nav-section-label">Content</div>
      <a href="showcase-list.html" class="nav-link">🎨 Showcase</a>
      <a href="pricing-list.html" class="nav-link">💰 Pricing</a>
      <div class="nav-section-label">Admin</div>
      <a href="users-list.html" class="nav-link">👥 Users</a>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" id="logoutBtn">Sign out</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="page-title">Project Detail</span>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>
    <div class="content">
      <div id="errorMsg"></div>
      <div class="card" style="max-width:680px" id="detailCard">
        <div class="loader"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <script type="module">
    import supabase from '../js/supabase-client.js';
    import '../js/auth-guard.js';

    const id = new URLSearchParams(window.location.search).get('id');
    if (!id) { window.location.href = 'projects-list.html'; }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    });

    const statusBadge = { draft: 'badge-yellow', live: 'badge-green', archived: 'badge-gray' };

    const { data, error } = await supabase.from('projects').select('*').eq('id', id).single();
    if (error) {
      document.getElementById('errorMsg').innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
      document.getElementById('detailCard').innerHTML = '';
    } else {
      document.getElementById('topbarActions').innerHTML = `
        <a href="projects-form.html?id=${id}" class="btn btn-secondary btn-sm">Edit</a>
        <a href="projects-delete.html?id=${id}" class="btn btn-danger btn-sm">Delete</a>
        <a href="projects-list.html" class="btn btn-ghost btn-sm">← Back</a>`;
      const appUrlHtml = data.app_url
        ? `<a href="${esc(data.app_url)}" target="_blank" rel="noopener">${esc(data.app_url)}</a>`
        : '—';
      document.getElementById('detailCard').innerHTML = `
        <div class="card-header">
          <h2>${esc(data.name)}</h2>
          <span class="badge ${statusBadge[data.status]||'badge-gray'}">${esc(data.status)}</span>
        </div>
        <div class="card-body">
          <dl class="detail-list">
            <dt>Description</dt><dd>${esc(data.description)||'—'}</dd>
            <dt>App URL</dt><dd>${appUrlHtml}</dd>
            <dt>Deploy Target</dt><dd>${esc(data.deploy_target)||'—'}</dd>
            <dt>Credits Used</dt><dd>${data.credits_used ?? 0}</dd>
            <dt>Owner ID</dt><dd style="font-size:12px;color:var(--text-muted)">${esc(data.owner_id)||'—'}</dd>
            <dt>Created</dt><dd>${fmtDate(data.created_at)}</dd>
            <dt>Updated</dt><dd>${fmtDate(data.updated_at)}</dd>
          </dl>
        </div>`;
    }

    function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function fmtDate(d) { return d ? new Date(d).toLocaleString() : '—'; }
  </script>
</body>
</html>
